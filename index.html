      <script>
        // Size the player snapshot before first paint: laid out at the
        // window's own size (so it is exactly the player as it would open
        // here), scaled onto the screen, which takes the window's aspect.
        // The height is only re-read when the width changes: a phone's
        // toolbars resize innerHeight on every scroll.
        (function () {
          var ipad = document.getElementById('play-stage');
          var host = document.getElementById('pp-app');
          if (!ipad || !host) return;
          var screen = ipad.querySelector('.ipad-screen');
          var W = 0, H = 0;
          function size() {
            if (host.classList.contains('is-flying')) return;
            var w = window.innerWidth;
            if (w !== W || !H) { W = w; H = window.innerHeight; }
            ipad.style.setProperty('--pp-aspect', W + ' / ' + H);
            host.style.width = W + 'px';
            host.style.height = H + 'px';
            host.style.setProperty('--pp-scale', String(screen.clientWidth / W));
          }
          size();
          window.addEventListener('resize', size);
          window.ppSize = size;
        })();
      </script>

  <script>
    // Cursor-reactive hero. Pointer-only, motion-safe, and purely decorative:
    // the page is fully correct with this script absent.
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var fine = window.matchMedia('(hover: hover) and (pointer: fine)');
      if (reduce.matches || !fine.matches) return;

      var hero = document.getElementById('hero');
      if (!hero) return;

      var raf = 0;
      function write(tx, ty, glow) {
        hero.style.setProperty('--mx', tx.toFixed(3));
        hero.style.setProperty('--my', ty.toFixed(3));
        hero.style.setProperty('--glow', glow.toFixed(3));
      }
      function onMove(e) {
        var r = hero.getBoundingClientRect();
        if (!r.width) return;
        var tx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
        var ty = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
        var glow = 1 - Math.min(1, Math.sqrt(tx * tx + ty * ty) / 1.4);
        // Write immediately, then coalesce any burst of moves into one more frame.
        if (raf) return;
        write(tx, ty, glow);
        raf = requestAnimationFrame(function () { raf = 0; });
      }
      window.addEventListener('pointermove', onMove, { passive: true });
      window.addEventListener('pointerleave', function () { write(0, 0, 0); }, { passive: true });
    })();
  </script>

  <script>
    // The player on the iPad plays its song, and launches for real.
    //
    // #pp-app is a snapshot of the actual player (design/gen-app-snapshot.mjs):
    // its markup and CSS in a shadow root, song maker open. Playback replays
    // the per-step changes recorded from the player itself (playhead, hit
    // cells, glowing keys), so it looks exactly like the player playing.
    //
    // Launch: the player is lifted out of the iPad into a fixed layer and
    // grows to fill the window while its song maker and transport collapse
    // and the header's play button slides in — the player's own piano-only
    // mode, which is how it opens. On landing that state is swapped for the
    // snapshot of the real piano-only frame, then the page navigates; the
    // player's first paint is the same frame. Progressive: with this script
    // absent (or JS off) both triggers are plain links.
    (function () {
      var btn = document.getElementById('play-web');
      var ipad = document.getElementById('play-stage');
      var screen = ipad && ipad.querySelector('.ipad-screen');
      var host = document.getElementById('pp-app');
      var dataEl = document.getElementById('pp-app-data');
      var sr = host && host.shadowRoot;
      if (!btn || !ipad || !screen || !sr || !dataEl) return;

      var data = JSON.parse(dataEl.textContent);
      var theme = sr.querySelector('.pp-app-theme');
      var openMarkup = theme.innerHTML;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var url = btn.getAttribute('href');
      var STEP_MS = 180; // SPEEDS.medium in the player

      // --- Playback ---
      var els, grid, scroller, playBtn, playhead = null;
      function index() {
        els = {};
        theme.querySelectorAll('[data-cell],[data-midi]').forEach(function (el) {
          els[el.dataset.cell ? 'c' + el.dataset.cell : 'k' + el.dataset.midi] = el;
        });
        grid = theme.querySelector('[data-cell]').parentElement.parentElement;
        scroller = grid.parentElement;
        playBtn = theme.querySelector('main ~ div button[aria-label="Play the song"]');
      }
      function patch(list) {
        for (var i = 0; i < list.length; i++) {
          var el = els[list[i][0]];
          if (!el) continue;
          el.className = data.strings[list[i][1]];
          el.setAttribute('style', data.strings[list[i][2]]);
        }
      }
      function show(step) {
        patch(data.neutral);
        patch(data.steps[step].els);
        playhead.setAttribute('style', data.steps[step].p);
        // The player keeps the playhead in view when the roll scrolls.
        var overflow = scroller.scrollWidth - scroller.clientWidth;
        if (overflow > 0) scroller.scrollTo({ left: (step / 15) * overflow, behavior: 'smooth' });
      }

      var playing = false, step = -1, nextAt = 0, raf = 0, visible = true;
      function frame(now) {
        raf = 0;
        if (!playing) return;
        if (now >= nextAt) {
          // rAF sleeps in background tabs; resume in tempo on return.
          if (now - nextAt > 1000) nextAt = now;
          step = (step + 1) % 16;
          show(step);
          nextAt += STEP_MS;
        }
        raf = requestAnimationFrame(frame);
      }
      function play() {
        if (playing || reduce.matches || !visible) return;
        playing = true;
        var t = document.createElement('template');
        t.innerHTML = data.playhead;
        playhead = t.content.firstElementChild;
        grid.insertBefore(playhead, grid.firstChild);
        playBtn.innerHTML = data.tPlaying;
        nextAt = performance.now() + 400;
        raf = requestAnimationFrame(frame);
      }
      function stop() {
        if (!playing) return;
        playing = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        step = -1;
        patch(data.neutral);
        if (playhead) playhead.remove();
        playhead = null;
        playBtn.innerHTML = data.tStopped;

      // --- Prefetch, once, on first intent (hover or touch) ---
      var warmed = false;
      function warm() {

        warmed = true;
        var l = document.createElement('link');

        l.rel = 'prefetch';
        l.href = url;
        l.as = 'document';
        document.head.appendChild(l);
      }

      // --- Hover lift ---

        if (reduce.matches) return;
        ipad.classList.toggle('is-lifted', on);
      }

      // Stars hold their opening state through the flight: the player starts
      // its twinkle from zero, so that is the frame to land on.
      function stillStars() {
        sr.getAnimations().forEach(function (a) { a.currentTime = 0; a.pause(); });
      }

      // --- The flight, shared by every trigger ---
      var launching = false;
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      var anims = [];
      var EASE = 'cubic-bezier(.6,0,.3,1)', DUR = 820, DELAY = 40;

      function launch() {
        if (launching) return;
        launching = true;
        warm();
        stop();

        // Freeze the page (this drops the scrollbar, so it goes first: the
        // measurements below must see the final layout).
        document.documentElement.classList.add('is-launching');

        // Where the screen sits once the tilt is off.
        ipad.classList.add('is-measuring');
        var r = screen.getBoundingClientRect();
        var radius = parseFloat(getComputedStyle(screen).borderTopLeftRadius) || 0;
        ipad.classList.remove('is-measuring');
        void ipad.offsetWidth;
        ipad.classList.add('is-launched');

        // above it on phones) starts from a visible point instead.

        var veil = document.createElement('div');

        document.body.appendChild(veil);

        // scale, so the page can fade away underneath it.
        var W = host.offsetWidth, H0 = host.offsetHeight;
        var s0 = r.width / W;

          // plain styles (a layer left on the compositor keeps a mid-flight

          theme.innerHTML = data.closed;

          anims.forEach(function (a) { a.cancel(); });
          anims = [];
          host.style.transform = 'none';
          host.style.height = vh + 'px';
          host.style.borderRadius = '0';
          host.classList.add('is-landed');
          window.location.href = url;
        }
        anims[0].finished.then(go, function () {});
        setTimeout(go, 2000);
      }

      // The song maker folds away into piano-only mode, as the player's own
      // song-maker button would do: roll, divider and transport close up
      // (their contents clipped, not squashed), the keyboard rises into the
      // space, the header's play button opens up beside mute, and the
      // song-maker button lets go of its highlight.
      function collapse(opts) {
        var main = theme.querySelector('main');
        var handle = theme.querySelector('[role="separator"]');
        var transport = handle.nextElementSibling;
        var keys = main.parentElement.nextElementSibling;
        var closed = document.createElement('template');
        closed.innerHTML = data.closed;
        var closedHeader = closed.content.querySelector('header');

        // Measure everything first, then pin it: pinning one part must not
        // reflow the next before it is measured.
        var parts = [main, handle, transport].map(function (el) {
          var cs = getComputedStyle(el);
          return {
            el: el, h: el.offsetHeight, pt: cs.paddingTop, pb: cs.paddingBottom,
            kids: Array.prototype.map.call(el.children, function (c) { return [c, c.offsetHeight]; })
          };
        });
        parts.forEach(function (p) {
          var el = p.el;
          p.kids.forEach(function (k) { k[0].style.height = k[1] + 'px'; k[0].style.flex = 'none'; });
          el.style.height = p.h + 'px';
          el.style.minHeight = '0';
          el.style.overflow = 'hidden';
          el.style.flexShrink = '0';
          anims.push(el.animate([
            { height: p.h + 'px', paddingTop: p.pt, paddingBottom: p.pb },
            { height: '0px', paddingTop: '0px', paddingBottom: '0px' }
          ], opts));
          // Fades on the fold's own curve, so it never leaves an empty band.
          anims.push(el.animate([{ opacity: 1 }, { opacity: 0 }], opts));
        });
        anims.push(keys.animate([{ paddingTop: '0px' }, { paddingTop: '4px' }], opts));

        // Header: the play button that piano-only mode shows beside mute.
        var group = theme.querySelector('header').lastElementChild;
        var toggle = group.querySelector('[aria-expanded]');
        var headerPlay = closedHeader.lastElementChild.firstElementChild.cloneNode(true);
        var size = toggle.offsetWidth;
        var gap = parseFloat(getComputedStyle(group).columnGap) || 0;
        headerPlay.style.overflow = 'hidden';
        group.insertBefore(headerPlay, group.firstChild);
        anims.push(headerPlay.animate([
          { width: '0px', marginRight: -gap + 'px', opacity: 0 },
          { width: size + 'px', marginRight: '0px', opacity: 1 }
        ], opts));
        toggle.className = closedHeader.querySelector('[aria-expanded]').className;
      }

      // --- Wire up a trigger ---
      function arm(el) {
        el.addEventListener('pointerenter', function () { warm(); lift(true); });
        el.addEventListener('pointerleave', function () { lift(false); });
        el.addEventListener('focus', function () { warm(); lift(true); });
        el.addEventListener('blur', function () { lift(false); });
        el.addEventListener('touchstart', warm, { passive: true });

        el.addEventListener('click', function (e) {
          // Let modified clicks (new tab/window) and non-primary buttons
          // behave normally — never trap a deliberate new-tab open.
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          if (launching) { e.preventDefault(); return; }
          if (reduce.matches || typeof host.animate !== 'function') return; // straight navigation
          e.preventDefault();
          launch();
        });
      }

      arm(btn);
      arm(ipad);

      // Coming back via the back button restores a cached page mid-flight;
      // put the player back on the iPad and clear the launch state.
      window.addEventListener('pageshow', function (ev) {
        if (!ev.persisted) return;
        launching = false;
        anims.forEach(function (a) { a.cancel(); });
        anims = [];
        host.classList.remove('is-flying', 'is-landed');
        host.style.transform = '';
        host.style.borderRadius = '';
        screen.appendChild(host);
        theme.innerHTML = openMarkup;
        index();
        ipad.classList.remove('is-launched', 'is-lifted');
        document.documentElement.classList.remove('is-launching');
        if (themeMeta && !themeMeta.isConnected) document.head.appendChild(themeMeta);
        var v = document.querySelector('.launch-veil');
        if (v) v.remove();
        if (window.ppSize) window.ppSize();
        play();
      });
    })();
  </script>

</body>
</html>
