  <script>
    // Cursor-reactive hero. Pointer-only, motion-safe, and purely decorative:
    // the page is fully correct with this script absent.
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var fine = window.matchMedia('(hover: hover) and (pointer: fine)');
      if (reduce.matches || !fine.matches) return;

      var hero = document.getElementById('hero');
      if (!hero) return;

      var raf = 0;
      function write(tx, ty, glow) {
        hero.style.setProperty('--mx', tx.toFixed(3));
        hero.style.setProperty('--my', ty.toFixed(3));
        hero.style.setProperty('--glow', glow.toFixed(3));
      }
      function onMove(e) {
        var r = hero.getBoundingClientRect();
        if (!r.width) return;
        var tx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
        var ty = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
        var glow = 1 - Math.min(1, Math.sqrt(tx * tx + ty * ty) / 1.4);
        // Write immediately, then coalesce any burst of moves into one more frame.
        if (raf) return;
        write(tx, ty, glow);
        raf = requestAnimationFrame(function () { raf = 0; });
      }
      window.addEventListener('pointermove', onMove, { passive: true });
      window.addEventListener('pointerleave', function () { write(0, 0, 0); }, { passive: true });
    })();
  </script>

  <script>
    // Play-in-browser launch: lift the iPad while either trigger is hovered,
    // prefetch the player, then open it on click. Both the CTA button and the
    // iPad mockup itself launch it. Entirely progressive — with this script
    // absent (or JS off) each is a plain link that navigates immediately.
    //
    // The flight is built so the hand-off can't be seen: a replica of the
    // player's opening frame (#ppx-template — header strip over the full
    // keyboard, laid out at the real viewport size) fades in over the iPad's
    // screen, then grows to fill the window. Its last frame is the player's
    // first paint, so when the new page takes over nothing moves.
    (function () {
      var btn = document.getElementById('play-web');
      var ipad = document.querySelector('.ipad');
      var screen = ipad && ipad.querySelector('.ipad-screen');
      var tpl = document.getElementById('ppx-template');
      if (!btn || !ipad || !screen || !tpl || !('content' in tpl)) return;

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var url = btn.getAttribute('href');
      var warmed = false;

      // --- Prefetch, once, on first intent (hover or touch) ---
      function warm() {
        if (warmed) return;
        warmed = true;
        var l = document.createElement('link');
        // prefetch, not prerender: cheap, and safe if the player is heavy.
        l.rel = 'prefetch';
        l.href = url;
        l.as = 'document';
        document.head.appendChild(l);
        replica();
      }

      // --- Hover lift ---
      function lift(on) {
        if (reduce.matches) return;
        ipad.classList.toggle('is-lifted', on);
      }

      // --- The player's opening frame ---
      // Keys and stars are generated from the same formulas the player uses
      // (piano-keys.tsx, data.ts) rather than copied as markup.
      var HUES = [350, 20, 45, 70, 95, 135, 165, 190, 225, 265, 295, 320];
      var NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      // Computer-key hints by offset from the lowest key (KEY_OFFSETS).
      var HINTS = 'awsedftgyhujkolp;';
      var BASE_MIDI = 60, MIN_WHITE = 7, MAX_WHITE = 15;

      function note(midi, l, c, a) {
        return 'oklch(' + l + ' ' + c + ' ' + HUES[midi % 12] + (a == null ? '' : ' / ' + a) + ')';
      }
      function isBlack(midi) { return NAMES[midi % 12].length > 1; }
      function el(tag, cls, css) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (css) e.style.cssText = css;
        return e;
      }
      function hint(midi, cls, color) {
        var h = HINTS.charAt(midi - BASE_MIDI);
        if (!h) return null;
        var s = el('span', cls, 'color:' + color);
        s.textContent = h;
        return s;
      }
      // A key only shows once the keybed is wide enough for `count` whites.
      function countClass(count) { return count > MIN_WHITE ? ' ppx-key-' + count : ''; }

      // Deterministic star field (buildStars in data.ts): one star per cell
      // of an 8 x 6 grid, jittered within it.
      function hash(i, salt) {
        var x = Math.sin(i * 127.1 + salt * 311.7) * 43758.5453;
        return x - Math.floor(x);
      }
      function round2(n) { return Math.round(n * 100) / 100; }

      var app = null;
      function replica() {
        if (app) return app;
        app = tpl.content.firstElementChild.cloneNode(true);

        var sky = app.querySelector('.ppx-sky');
        for (var i = 0; i < 48; i++) {
          var x = round2(Math.max(0, Math.min(99, (i % 8 + 0.5 + (hash(i, 1) - 0.5) * 0.7) * 12.5)));
          var y = round2(Math.max(0, Math.min(99, (Math.floor(i / 8) + 0.5 + (hash(i, 2) - 0.5) * 0.7) * (100 / 6))));
          var size = round2(1 + hash(i, 3) * 2.6);
          var sparkle = hash(i, 6) > 0.84;
          var d = sparkle ? size * 2 : size;
          sky.appendChild(el('span', sparkle ? 'ppx-star ppx-sparkle' : 'ppx-star',
            'left:' + x + '%;top:' + y + '%;width:' + d + 'px;height:' + d + 'px'));
        }

        var whites = [];
        for (var m = BASE_MIDI; whites.length < MAX_WHITE; m++) if (!isBlack(m)) whites.push(m);

        var wrow = app.querySelector('.ppx-whites');
        whites.forEach(function (midi, index) {
          var k = el('span', 'ppx-white' + countClass(index + 1),
            'background:linear-gradient(180deg,' + note(midi, 0.98, 0.01) + ' 0%,' + note(midi, 0.88, 0.09) + ' 100%);' +
            'box-shadow:inset 0 -6px 0 ' + note(midi, 0.78, 0.12));
          var h = hint(midi, 'ppx-hint', note(midi, 0.62, 0.04));
          if (h) k.appendChild(h);
          var letter = el('span', 'ppx-letter', 'color:' + note(midi, 0.45, 0.15));
          letter.textContent = NAMES[midi % 12];
          k.appendChild(letter);
          wrow.appendChild(k);
        });

        var brow = app.querySelector('.ppx-blacks');
        whites.slice(0, -1).forEach(function (white, index) {
          var midi = white + 1;
          if (!isBlack(midi)) return;
          var k = el('span', 'ppx-black' + countClass(index + 2),
            'left:calc(' + (index + 1) + ' * 100% / var(--ppx-whites));' +
            'background:linear-gradient(180deg,' + note(midi, 0.36, 0.1) + ' 0%,' + note(midi, 0.25, 0.08) + ' 100%);' +
            'box-shadow:inset 0 -5px 0 ' + note(midi, 0.52, 0.17) + ',0 4px 8px oklch(0.15 0.03 275 / 0.6)');
          var h = hint(midi, 'ppx-hint', note(midi, 0.78, 0.06));
          if (h) k.appendChild(h);
          brow.appendChild(k);
        });
        return app;
      }

      // --- The flight, shared by every trigger ---
      var launching = false;
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      var anims = [];

      function launch() {
        if (launching) return;
        launching = true;
        warm();
        var frame = replica();

        // Freeze the page (this drops the scrollbar, so it goes first: the
        // measurements below must see the final layout).
        document.documentElement.classList.add('is-launching');

        // Where the screen sits once the tilt is off — the panel settles
        // flat while the replica fades in over it.
        ipad.classList.add('is-measuring');
        var r = screen.getBoundingClientRect();
        var radius = parseFloat(getComputedStyle(screen).borderTopLeftRadius) || 0;
        ipad.classList.remove('is-measuring');
        void ipad.offsetWidth;
        ipad.classList.add('is-launched');

        // A trigger used while the panel sits below the fold (the CTA is
        // above it on phones) starts from a visible point instead.
        var vh = window.innerHeight;
        var top = Math.min(r.top, vh - r.height * 0.55);

        var veil = document.createElement('div');
        veil.className = 'launch-veil';
        document.body.appendChild(veil);
        document.body.appendChild(frame);

        // The replica is laid out at the viewport's width from the start, so
        // its header, key count and breakpoints are final throughout; only
        // its height stretches (the keys absorb it, as in the player) while
        // a uniform scale maps it onto the screen. Scale and height move on
        // one curve, and its end state is the player's first frame.
        var vw = frame.offsetWidth;
        var H = frame.offsetHeight;
        var s0 = r.width / vw;
        var h0 = r.height / s0;

        anims.push(frame.animate([
          { transform: 'translate(' + r.left + 'px,' + top + 'px) scale(' + s0 + ')', height: h0 + 'px', borderRadius: radius / s0 + 'px' },
          { transform: 'translate(0px,0px) scale(1)', height: H + 'px', borderRadius: '0px' }
        ], { duration: 760, delay: 110, easing: 'cubic-bezier(.7,0,.2,1)', fill: 'both' }));
        anims.push(frame.animate([{ opacity: 0 }, { opacity: 1 }],
          { duration: 180, delay: 40, easing: 'ease-out', fill: 'both' }));

        veil.classList.add('on');
        // Safari tints its toolbars from theme-color; without one it samples
        // the page, which from here on is the player's own header.
        if (themeMeta) themeMeta.remove();

        // Navigate when the flight lands — with a timer as the backstop so a
        // dropped finish event can never strand the user here. The replica
        // stays up until the player paints over it.
        var went = false;
        function go() {
          if (went) return;
          went = true;
          // Swap the animated end state for the same frame as plain styles:
          // a layer left on the compositor keeps the raster from mid-flight,
          // a shade softer than the page that replaces it.
          frame.classList.add('is-landed');
          anims.forEach(function (a) { a.cancel(); });
          anims = [];
          window.location.href = url;
        }
        anims[0].finished.then(go, function () {});
        setTimeout(go, 2000);
      }

      // --- Wire up a trigger ---
      function arm(el) {
        el.addEventListener('pointerenter', function () { warm(); lift(true); });
        el.addEventListener('pointerleave', function () { lift(false); });
        el.addEventListener('focus', function () { warm(); lift(true); });
        el.addEventListener('blur', function () { lift(false); });
        el.addEventListener('touchstart', warm, { passive: true });

        el.addEventListener('click', function (e) {
          // Let modified clicks (new tab/window) and non-primary buttons
          // behave normally — never trap a deliberate new-tab open.
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          if (launching) { e.preventDefault(); return; }
          if (reduce.matches || !frameSupported) return; // straight navigation, no flight
          e.preventDefault();
          launch();
        });
      }

      // The replica needs the Web Animations API and container queries (for
      // the key count); anywhere without them a plain navigation is better
      // than a replica that doesn't match.
      var frameSupported = typeof Element.prototype.animate === 'function' &&
        !!(window.CSS && CSS.supports && CSS.supports('container-type', 'inline-size'));

      arm(btn);
      if (ipad.tagName === 'A') arm(ipad);

      // Coming back via the back button restores a cached page mid-flight;
      // clear the launch state so the site is usable again.
      window.addEventListener('pageshow', function (ev) {
        if (!ev.persisted) return;
        launching = false;
        anims.forEach(function (a) { a.cancel(); });
        anims = [];
        if (app) { app.remove(); app.classList.remove('is-landed'); }
        ipad.classList.remove('is-launched', 'is-lifted');
        document.documentElement.classList.remove('is-launching');
        if (themeMeta && !themeMeta.isConnected) document.head.appendChild(themeMeta);
        var v = document.querySelector('.launch-veil');
        if (v) v.remove();
      });
    })();
  </script>

  <script>
    // Sequencer animation: the mockup "plays" the tune drawn in the song
    // maker. A stepped playhead sweeps the grid, lit cells flash, and the
    // matching rainbow keys press down in time. Motion-safe and purely
    // decorative — with this script absent the panel is the same still
    // mockup as before.
    //
    // TEMPORARY tuning jig: every dial reads from the URL (?bpm=96&hold=.85
    // ...), and ?jig shows sliders that rewrite the URL live. Dial it in,
    // copy the URL, and the numbers get baked in here as the defaults.
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (reduce.matches) return;

      var screen = document.querySelector('.ipad-screen');
      var rows = document.querySelectorAll('.cells .rollrow');
      var keys = document.querySelectorAll('.app-keys .wk');
      var play = document.querySelector('.play');
      if (!screen || rows.length !== 8 || keys.length !== 14 || !play) return;

      // Lanes top→bottom are E D C A G E D C; map each to its white key
      // (two C-major octaves, low C at index 0).
      var LANE_KEY = [9, 8, 7, 5, 4, 2, 1, 0];
      var STEPS = 16;

      var q = new URLSearchParams(location.search);
      function num(name, fallback) {
        var v = parseFloat(q.get(name));
        return isFinite(v) ? v : fallback;
      }

      // The dials. URL params override; ?jig shows sliders for them.
      var cfg = {
        bpm:   num('bpm',   96),   // tempo — two grid steps per beat
        hold:  num('hold',  0.85), // note length, as a fraction of one step
        dip:   num('dip',   0.7),  // key press depth (cqw)
        glow:  num('glow',  1),    // pressed-key / hit-cell glow strength
        flash: num('flash', 1.45), // hit-cell flash brightness
        gap:   num('gap',   2)     // silent steps between loops
      };

      function stepMs() { return 60000 / cfg.bpm / 2; }
      function applyVars() {
        screen.style.setProperty('--seq-dip', cfg.dip);
        screen.style.setProperty('--seq-glow', cfg.glow);
        screen.style.setProperty('--seq-flash', cfg.flash);
      }
      applyVars();

      // Column model: every cell in the column (for the playhead) plus the
      // lit cells paired with the key each one triggers.
      var cols = [];
      for (var c = 0; c < STEPS; c++) {
        var col = { cells: [], notes: [] };
        for (var r = 0; r < rows.length; r++) {
          var cell = rows[r].children[c];
          if (!cell) continue;
          col.cells.push(cell);
          if (cell.classList.contains('on')) {
            col.notes.push({ cell: cell, key: keys[LANE_KEY[r]] });
          }
        }
        cols.push(col);
      }

      var step = -1;
      var nextAt = performance.now() + 800;
      var phCells = [];   // cells carrying the playhead highlight
      var lit = [];       // {el, cls} waiting to be un-lit at el._seqUntil

      function arm(el, cls, until) {
        el.classList.add(cls);
        el._seqUntil = until;
        lit.push({ el: el, cls: cls });
      }

      function trigger(now) {
        step = (step + 1) % (STEPS + Math.max(0, Math.round(cfg.gap)));
        for (var i = 0; i < phCells.length; i++) phCells[i].classList.remove('ph');
        phCells = [];
        if (step >= STEPS) return; // the breath between loops

        var col = cols[step];
        var until = now + stepMs() * cfg.hold;
        for (var i = 0; i < col.cells.length; i++) {
          col.cells[i].classList.add('ph');
          phCells.push(col.cells[i]);
        }
        for (var i = 0; i < col.notes.length; i++) {
          arm(col.notes[i].cell, 'hit', until);
          arm(col.notes[i].key, 'pressed', until);
        }
      }

      function release(now) {
        for (var i = lit.length - 1; i >= 0; i--) {
          if (now < lit[i].el._seqUntil) continue;
          lit[i].el.classList.remove(lit[i].cls);
          lit.splice(i, 1);
        }
      }

      function frame(now) {
        // Hold still while the launch flight owns the panel.
        if (!document.documentElement.classList.contains('is-launching')) {
          if (now >= nextAt) {
            // rAF sleeps in background tabs; on return, resume in tempo
            // instead of machine-gunning every missed step.
            if (now - nextAt > 1000) nextAt = now;
            trigger(now);
            nextAt += stepMs();
          }
          release(now);
        }
        requestAnimationFrame(frame);
      }
      play.classList.add('playing');
      requestAnimationFrame(frame);

      // --- TEMPORARY tuning jig (?jig) — remove once values are baked ---
      if (!q.has('jig')) return;

      var DIALS = [
        ['bpm',   40, 200, 1],
        ['hold', 0.1, 1.5, 0.05],
        ['dip',    0,   2, 0.05],
        ['glow',   0,   3, 0.1],
        ['flash',  1, 2.2, 0.05],
        ['gap',    0,   8, 1]
      ];

      var jig = document.createElement('div');
      jig.className = 'seq-jig';
      var title = document.createElement('b');
      title.textContent = 'Sequencer jig';
      jig.appendChild(title);

      var urlOut = document.createElement('code');
      function syncUrl() {
        DIALS.forEach(function (d) { q.set(d[0], String(cfg[d[0]])); });
        var qs = '?' + q.toString();
        history.replaceState(null, '', qs);
        urlOut.textContent = qs;
      }

      DIALS.forEach(function (d) {
        var name = d[0];
        var row = document.createElement('label');
        var lab = document.createElement('span');
        lab.textContent = name;
        var input = document.createElement('input');
        input.type = 'range';
        input.min = d[1]; input.max = d[2]; input.step = d[3];
        input.value = cfg[name];
        var val = document.createElement('span');
        val.textContent = String(cfg[name]);
        input.addEventListener('input', function () {
          cfg[name] = parseFloat(input.value);
          val.textContent = input.value;
          applyVars();
          syncUrl();
        });
        row.appendChild(lab); row.appendChild(input); row.appendChild(val);
        jig.appendChild(row);
      });

      jig.appendChild(urlOut);
      var hint = document.createElement('small');
      hint.textContent = 'Click the params to select, then send them back to bake in.';
      jig.appendChild(hint);
      syncUrl();
      document.body.appendChild(jig);
    })();
  </script>
</body>
